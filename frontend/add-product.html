<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183b32"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="style.css"><title>Ajouter un produit — Maison Yazid</title></head><body><main class="section"><div style="max-width:680px;margin:auto;background:white;padding:clamp(25px,5vw,55px);box-shadow:var(--shadow)"><a class="text-link" href="admin.html">← Retour au tableau de bord</a><span class="eyebrow" style="display:block;margin-top:35px">Catalogue · Administration</span><h1 class="serif" style="font-size:42px;color:var(--forest);font-weight:400">Ajouter une pièce</h1><p style="font-size:12px;color:var(--muted);line-height:1.8;margin-bottom:30px">Renseignez les informations du produit qui apparaîtra dans la collection publique.</p><form id="productForm"><div class="field-group"><label for="name">Nom du produit</label><input class="field" id="name" required maxlength="120"></div><div class="field-group"><label for="price">Prix (DT)</label><input class="field" type="number" id="price" min="0" step="0.01" required></div><div class="field-group"><label for="description">Description</label><textarea class="field" id="description" rows="4" maxlength="1000"></textarea></div><div class="field-group"><label for="image">Image du produit</label><input class="field" type="file" id="image" accept="image/jpeg,image/png,image/webp" required></div><button class="btn" type="submit">Publier le produit ↗</button><p id="productNotice" class="notice" aria-live="polite"></p></form></div></main><script src="script.js"></script><script>const token=localStorage.getItem('myr_admin_token');if(!token)location.href='login.html';document.querySelector('#productForm').addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData();fd.append('name',document.querySelector('#name').value);fd.append('price',document.querySelector('#price').value);fd.append('description',document.querySelector('#description').value);fd.append('image',document.querySelector('#image').files[0]);const n=document.querySelector('#productNotice');try{await fetch('/api/products',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Erreur');return d});n.textContent='Produit publié avec succès.';n.className='notice success';e.target.reset()}catch(err){n.textContent=err.message;n.className='notice error'}})</script></body></html>
