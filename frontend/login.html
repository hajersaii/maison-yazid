<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183b32"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="style.css"><title>Administration — Maison Yazid</title></head><body><main class="login-wrap"><div class="login-art"><div><span class="eyebrow" style="color:#e1c99d">Maison Yazid · Privé</span><h1>L’exigence se cultive dans chaque détail.</h1></div></div><div class="login-card"><form id="loginForm"><a class="brand" href="index.html"><span class="brand-mark">MYR</span><span class="brand-copy"><strong>MAISON YAZID</strong><small>Espace administration</small></span></a><h2>Bienvenue.</h2><p>Connectez-vous pour gérer votre collection et suivre les demandes reçues.</p><div class="field-group"><label for="email">Adresse e-mail</label><input class="field" type="email" id="email" required autocomplete="username" placeholder="admin@maison-yazid.tn"></div><div class="field-group"><label for="password">Mot de passe</label><input class="field" type="password" id="password" required autocomplete="current-password" placeholder="Votre mot de passe"></div><button class="btn" style="width:100%" type="submit">Accéder au tableau de bord ↗</button><p id="loginNotice" class="notice" aria-live="polite"></p><a class="text-link" href="index.html">← Retour au site</a></form></div></main><script src="script.js"></script><script>document.querySelector('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const n=document.querySelector('#loginNotice');try{const r=await request('/api/auth/login',{method:'POST',body:JSON.stringify({email:document.querySelector('#email').value,password:document.querySelector('#password').value})});if(r.user.role!=='admin')throw new Error('Ce compte ne possède pas les droits administrateur.');localStorage.setItem('myr_admin_token',r.token);location.href='admin.html'}catch(err){n.textContent=err.message;n.className='notice error'}})</script></body></html>
